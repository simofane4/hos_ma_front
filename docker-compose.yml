services:
  front:
    container_name: hos_ma_front_dev
    build:
      context: .
      dockerfile: dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - angular_cache:/app/.angular
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true

volumes:
  node_modules:
  angular_cache: