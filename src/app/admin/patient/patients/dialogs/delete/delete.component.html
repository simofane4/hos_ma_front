<div class="container">
  <h3 mat-dialog-title>Are you sure?</h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p><span class="font-weight-bold">Name: </span>{{ name }}</p>
      </li>
      <li>
        <p><span class="font-weight-bold">CIN: </span>{{ data.cin || '-' }}</p>
      </li>
      <li>
        <p><span class="font-weight-bold">Cabinet: </span>{{ data.cabinet_name || ('#' + data.cabinet) }}</p>
      </li>
      <li>
        <p><span class="font-weight-bold">Phone: </span>{{ data.phone || '-' }}</p>
      </li>
    </ul>
    <p class="mb-0">
      This removes the patient and everything attached to them, including
      documents, appointments and invoices. It cannot be undone.
    </p>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button mat-flat-button color="warn" [disabled]="loading" (click)="confirmDelete()">
      {{ loading ? 'Deleting...' : 'Delete' }}
    </button>
    <button mat-flat-button (click)="onNoClick()" tabindex="-1">Cancel</button>
  </div>
</div>
