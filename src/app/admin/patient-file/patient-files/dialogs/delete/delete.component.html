<div class="container">
  <h3 mat-dialog-title>Are you sure?</h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p><span class="font-weight-bold">Number: </span>#{{ data.id }}</p>
      </li>
      <li>
        <p><span class="font-weight-bold">Document: </span>{{ (data.download_url || data.file).split('/').pop() }}</p>
      </li>
      <li>
        <p>
          <span class="font-weight-bold">Uploaded: </span>
          {{ data.uploaded_at | date: 'MM/dd/yyyy HH:mm' }}
        </p>
      </li>
    </ul>
    <p class="mb-0">This removes the document and its stored file. It cannot be undone.</p>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button mat-flat-button color="warn" [disabled]="loading" (click)="confirmDelete()">
      {{ loading ? 'Deleting...' : 'Delete' }}
    </button>
    <button mat-flat-button (click)="onNoClick()" tabindex="-1">Cancel</button>
  </div>
</div>
