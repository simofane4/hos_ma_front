<div class="container">
  <h3 mat-dialog-title>Are you sure?</h3>
  <div mat-dialog-content>
    <ul class="clearfix">
      <li>
        <p>
          <span class="font-weight-bold">{{ spec.labelField === 'name' ? 'Name' : 'Title' }}: </span>{{ label }}
        </p>
      </li>
      <li *ngIf="spec.hasCabinet">
        <p>
          <span class="font-weight-bold">Cabinet: </span>{{ row.cabinet ? ('#' + row.cabinet) : '-' }}
        </p>
      </li>
    </ul>
    <p class="mb-0">
      This removes the {{ spec.singular | lowercase }} permanently. It cannot be undone.
    </p>
  </div>
  <div mat-dialog-actions class="mb-1">
    <button mat-flat-button color="warn" [disabled]="loading" (click)="confirmDelete()">
      {{ loading ? 'Deleting...' : 'Delete' }}
    </button>
    <button mat-flat-button (click)="onNoClick()" tabindex="-1">Cancel</button>
  </div>
</div>
